<div class="no-data-center">
  <mat-icon fontSet="al" fontIcon="al-ico-model-endpoints" class="xxl"></mat-icon>
  @if (isLoading()) {
    <span class="message">{{ 'serving.empty.loading' | translate }}</span>
  } @else {
    <span class="message">{{ 'serving.empty.noActive' | translate }}</span>
    <span class="sub-message">{{ 'serving.empty.monitorPrefix' | translate }} <a href="https://github.com/allegroai/clearml-serving" target="_blank">
      clearml-serving</a>
      {{ 'serving.empty.orThe' | translate }} <a href="https://github.com/allegroai/clearml" target="_blank">ClearML</a> {{ 'serving.empty.httpRouter' | translate }}
   </span>
  }
</div>
