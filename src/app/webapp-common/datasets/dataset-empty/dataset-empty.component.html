@if (!showButton()) {
  <sm-dialog-template iconClass="al-ico-datasets" header="datasets.actions.createNewDataset">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </sm-dialog-template>
} @else {
  <ng-container *ngTemplateOutlet="content"></ng-container>
}
<ng-template #content>
  <div class="content">
    <div class="code">
      <p>
        {{ 'datasets.empty.description' | translate }}<br>
        {{ 'datasets.empty.quickExample' | translate }}<br>
        {{ 'datasets.empty.moreDetails' | translate }} <a [class.dark]="showButton()" [href]="confService.configuration().docsLink + '/latest/docs/clearml_data'" target="_blank" data-id="documentationLink">{{ 'header.documentation' | translate }}</a>
      </p>
      <div class="navbar">
        <mat-tab-group [(selectedIndex)]="index">
          <mat-tab [label]="'datasets.tabs.cli' | translate" data-id="CLITab"></mat-tab>
          <mat-tab [label]="'datasets.tabs.sdk' | translate" data-id="SDKTab"></mat-tab>
        </mat-tab-group>
      </div>
      @if (showCode()) {
        <sm-code-editor
          [code]="emptyStateTab() === 'cli' ? initDatasetCLICode: initDatasetSDKCode"
          [readonly]="true"
          [mode]="emptyStateTab() === 'cli' ? 'sh': 'python'"
          [showCopyButton]="true"
        ></sm-code-editor>
      }
    </div>
    <div class="diagram"><i class="i-datasets-empty-state" data-id="emptyDataSetDiagram"></i></div>
  </div>
</ng-template>
