<footer>
  <sm-admin-footer-actions></sm-admin-footer-actions>
  <div class="version float-right">
    <span>{{ 'settings.admin.footer.webApp' | translate }}: </span>
    <span>{{version["docker-image"] || version.version}}</span>
    @if (serverVersions(); as serverVersions) {
      <span> • {{ 'settings.admin.footer.server' | translate }}: {{serverVersions?.server}}</span>
      <span> • {{ 'settings.admin.footer.api' | translate }}: {{serverVersions?.api}}</span>
    }
  </div>
</footer>
