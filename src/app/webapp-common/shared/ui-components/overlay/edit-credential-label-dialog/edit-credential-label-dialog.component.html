<sm-confirm-dialog [displayX]="true">
  <div class="content">
    <mat-form-field appearance="outline" class="label-input no-bottom w-100" floatLabel="always">
      <mat-label>{{ 'credentials.label' | translate }}</mat-label>
      <input matInput [(ngModel)]="label" [placeholder]="'credentials.credentialsLabel' | translate" name="credentials" (keyup.enter)="closeDialog(true)">
    </mat-form-field>
  </div>
</sm-confirm-dialog>
