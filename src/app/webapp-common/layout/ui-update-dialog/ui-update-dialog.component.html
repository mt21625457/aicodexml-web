<sm-dialog-template
  subHeader="shared.reloadPagePrompt"
  [closeOnX]="true"
  header="shared.newVersionAvailable"
></sm-dialog-template>
<div mat-dialog-actions>
  <button mat-stroked-button mat-dialog-close>{{ 'shared.cancel' | translate }}</button>
  <button mat-flat-button (click)="reload()">{{ 'auth.reload' | translate }}</button>
</div>
