<div class="sm-card-list-header" [class.archive-mode]="archive()">
  @if (!disableSort()) {
    <div class="recent-title">
      <sm-menu [header]="sortByTitleKey() | translate" class="menu">
        <sm-menu-item [itemLabel]="'reports.sort.recent' | translate"
                      [sortOrder]="!isSortByName() && sortOrder()"
                      (itemClicked)="orderByChanged.emit('last_update')"></sm-menu-item>
        <sm-menu-item [itemLabel]="'reports.sort.name' | translate"
                      [sortOrder]="isSortByName() && sortOrder()"
                      (itemClicked)="orderByChanged.emit('name')"></sm-menu-item>
      </sm-menu>
      <sm-main-pages-header-filter [allTags]="allTags()"></sm-main-pages-header-filter>
      <sm-button-toggle
        [ngModel]="!!projectId()"
        (ngModelChange)="!archive() && !(!!projectId() && $event) && toggleNestedView.emit($any($event))"
        [disabled]="archive()"
        [options]="[
             {value: false, icon: 'al-ico-flat-view',  label: ('reports.views.list' | translate)},
             {value: true, icon:'al-ico-project-path', label: ('reports.views.project' | translate)}
            ]"
      ></sm-button-toggle>
      <sm-common-search class="ms-3"></sm-common-search>
    </div>
  }
  <div class="d-flex-center gap">
    <sm-toggle-archive
      [showArchived]="archive()"
      (toggleArchived)="archiveToggled.emit($event)"
    ></sm-toggle-archive>
    @if (!disableCreate()) {
      <button mat-flat-button
              [disabled]="archive()"
              (click)="createReportClicked.emit(projectId())">
        <mat-icon fontSet="al" fontIcon="al-ico-add"></mat-icon>
        {{ 'reports.actions.newReport' | translate }}
      </button>
    }
  </div>
</div>
